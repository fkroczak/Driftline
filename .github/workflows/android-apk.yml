# Baut eine Android-Debug-APK – nur auf ausdrücklichen Wunsch:
#  - Actions → „Android-APK bauen“ → „Run workflow“ (Branch wählbar)
#  - oder ein Tag „apk-…“ pushen, z. B. git tag apk-0.1 && git push origin apk-0.1
# Die APK landet als Vorabversion unter „Releases“ und lässt sich dort direkt am Handy laden.
name: Android-APK bauen

on:
  workflow_dispatch:
  push:
    tags: ["apk-*"]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot-Exportvorlagen aus dem Cache
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Godot installieren
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          if [ "${{ steps.templates.outputs.cache-hit }}" != "true" ]; then
            curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q templates.tpz -d "$RUNNER_TEMP/tpl"
            dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
            mkdir -p "$dest"
            mv "$RUNNER_TEMP"/tpl/templates/android_* "$RUNNER_TEMP"/tpl/templates/version.txt "$dest/"
          fi

      - name: Android SDK und Keystore einrichten
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Immer derselbe Schlüssel, damit sich neue APKs über die alte installieren lassen.
          # Standard: der Debug-Keystore im Repository; ein Secret kann ihn ersetzen.
          ks="$RUNNER_TEMP/debug.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
          else
            cp tools/android/debug.keystore "$ks"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          major_minor="${GODOT_VERSION%.*}"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${major_minor}.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          SETTINGS
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${major_minor}.tres

      - name: Versionsnummer setzen
        # versionCode zählt mit jedem Build hoch (Android verlangt das für Updates),
        # der Versionsname wird z. B. 0.2.17 und steht im Spiel auf der Sternenkarte.
        run: |
          base=$(sed -n 's/^config\/version="\(.*\)"/\1/p' game/project.godot)
          name="${base}.${GITHUB_RUN_NUMBER}"
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"${name}\"/" game/export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"${name}\"/" game/project.godot
          grep -E '^version/(code|name)=' game/export_presets.cfg
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"

      - name: Logiktests
        run: |
          "$GODOT" --headless --path game --import
          # Skriptfehler zählen nicht als Testfehler, darum zusätzlich die Ausgabe prüfen
          set -o pipefail
          "$GODOT" --headless --path game --script res://tests/run_tests.gd 2>&1 | tee test.log
          if grep -q "SCRIPT ERROR" test.log; then echo "Skriptfehler in den Tests"; exit 1; fi

      - name: APK exportieren
        run: |
          mkdir -p build
          "$GODOT" --headless --path game --export-debug "Android" ../build/hullbound-debug.apk
          test -s build/hullbound-debug.apk
          name="hullbound-${VERSION_NAME}-debug.apk"
          mv build/hullbound-debug.apk "build/$name"
          echo "APK=build/$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: hullbound-debug-apk
          path: ${{ env.APK }}
          retention-days: 14

      - name: Als Vorabversion veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('apk-build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Hullbound ${{ env.VERSION_NAME }}
          prerelease: true
          files: ${{ env.APK }}
          body: |
            Version ${{ env.VERSION_NAME }} (Build ${{ github.run_number }}) vom Branch `${{ github.ref_name }}`, Commit ${{ github.sha }}.
            Auf dem Handy herunterladen und öffnen; sie installiert sich als Update über die vorige Version.
            Beim ersten Mal „Aus dieser Quelle installieren“ erlauben.
